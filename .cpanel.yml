---
deployment:
  tasks:
    # --- Paths (edit DEPLOY_PATH if you publish to a subfolder) ---
    - export REPO_PATH="$PWD"
    - export APP_PATH="$REPO_PATH"
    - export BUILD_PATH="$APP_PATH/build"
    - export DEPLOY_PATH="$HOME/public_html"

    # --- Pick an npm executable that exists on your host ---
    - |
      if [ -x /opt/cpanel/ea-nodejs20/bin/npm ]; then export NPM=/opt/cpanel/ea-nodejs20/bin/npm;
      elif [ -x /opt/cpanel/ea-nodejs18/bin/npm ]; then export NPM=/opt/cpanel/ea-nodejs18/bin/npm;
      elif command -v npm >/dev/null 2>&1; then export NPM=$(command -v npm);
      else echo "npm not found. Install Node.js (EA Node.js) in cPanel." && exit 1;
      fi

    # --- Clean install & build (works for CRA/Vite/Next static export) ---
    - cd "$APP_PATH"
    - $NPM ci --no-audit --no-fund || $NPM install --no-audit --no-fund
    - |
      if [ -f package.json ]; then
        if $NPM run | grep -qE "^\\s*build\\s"; then
          $NPM run build
        else
          echo "No 'build' script in package.json" && exit 1
        fi
      else
        echo "package.json not found" && exit 1
      fi

    # --- Ensure build output path (adjust if your tool outputs to 'dist'/.next/out) ---
    - |
      if [ ! -d "$BUILD_PATH" ]; then
        # Try common alternatives
        if [ -d "$APP_PATH/dist" ]; then export BUILD_PATH="$APP_PATH/dist";
        elif [ -d "$APP_PATH/out" ]; then export BUILD_PATH="$APP_PATH/out";
        elif [ -d "$APP_PATH/.next" ] && [ -d "$APP_PATH/out" ]; then export BUILD_PATH="$APP_PATH/out";
        else echo "Build folder not found (checked build/, dist/, out/)" && exit 1;
        fi
      fi

    # --- Deploy: mirror build/ into public_html (prefer rsync; fallback to cp) ---
    - mkdir -p "$DEPLOY_PATH"
    - |
      if command -v rsync >/dev/null 2>&1; then
        rsync -a --delete "$BUILD_PATH"/ "$DEPLOY_PATH"/
      else
        /bin/rm -rf "$DEPLOY_PATH"/* && /bin/cp -R "$BUILD_PATH"/. "$DEPLOY_PATH"/
      fi

    # --- Optional: create SPA .htaccess so React Router works on refresh ---
    - |
      if [ ! -f "$DEPLOY_PATH/.htaccess" ]; then
        cat > "$DEPLOY_PATH/.htaccess" <<'HT'
# SPA redirect for React/Vite (Apache)
<IfModule mod_rewrite.c>
  RewriteEngine On
  RewriteBase /
  RewriteCond %{REQUEST_FILENAME} -f [OR]
  RewriteCond %{REQUEST_FILENAME} -d
  RewriteRule ^ - [L]
  RewriteRule . /index.html [L]
</IfModule>
HT
      fi

    # --- Log a friendly summary ---
    - echo "Deployed $(date) from $APP_PATH -> $DEPLOY_PATH"
